services:
  - type: web
    name: facefind-photos
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: MATCH_THRESHOLD
        value: "0.42"
      - key: FACE_MODEL
        value: buffalo_l
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PHOTOGRAPHER_EMAIL
        sync: false
